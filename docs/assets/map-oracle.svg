<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420"><defs><marker id="m-22211d" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#22211d"/></marker><marker id="m-b4551e" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#b4551e"/></marker><marker id="m-2e7d4f" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2e7d4f"/></marker><marker id="m-c23934" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#c23934"/></marker><marker id="m-8a8577" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8a8577"/></marker><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d9d3c4"/></pattern></defs><rect width="900" height="420" fill="#f4f1ea"/><rect width="900" height="420" fill="url(#dots)"/><text x="40" y="46" font-family="Archivo, system-ui, sans-serif" font-weight="800" font-size="21" fill="#22211d">One map, two jobs</text><text x="40" y="68" font-family="'Spline Sans Mono', ui-monospace, Menlo, monospace" font-size="11.5" fill="#8a8577">the same graph navigates the workflows and fact-checks their claims</text><rect x="354" y="104" width="200" height="90" rx="5" fill="#d9d3c4"/><rect x="350" y="100" width="200" height="90" rx="5" fill="#fdfcf8" stroke="#b4551e" stroke-width="1.5"/><text x="450.0" y="127" text-anchor="middle" font-family="Archivo, system-ui, sans-serif" font-weight="600" font-size="15.5" fill="#b4551e">the map</text><text x="450.0" y="148" text-anchor="middle" font-family="'Spline Sans Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#6b675c">every symbol,</text><text x="450.0" y="165" text-anchor="middle" font-family="'Spline Sans Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#6b675c">every proven edge</text><rect x="64" y="264" width="330" height="90" rx="5" fill="#d9d3c4"/><rect x="60" y="260" width="330" height="90" rx="5" fill="#fdfcf8" stroke="#22211d" stroke-width="1.5"/><text x="225.0" y="287" text-anchor="middle" font-family="Archivo, system-ui, sans-serif" font-weight="600" font-size="15.5" fill="#22211d">navigator</text><text x="225.0" y="308" text-anchor="middle" font-family="'Spline Sans Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#6b675c">workflows traverse real edges —</text><text x="225.0" y="325" text-anchor="middle" font-family="'Spline Sans Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#6b675c">no blind exploration</text><rect x="514" y="264" width="330" height="90" rx="5" fill="#d9d3c4"/><rect x="510" y="260" width="330" height="90" rx="5" fill="#fdfcf8" stroke="#22211d" stroke-width="1.5"/><text x="675.0" y="287" text-anchor="middle" font-family="Archivo, system-ui, sans-serif" font-weight="600" font-size="15.5" fill="#22211d">fact-checker</text><text x="675.0" y="308" text-anchor="middle" font-family="'Spline Sans Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#6b675c">every claim must produce</text><text x="675.0" y="325" text-anchor="middle" font-family="'Spline Sans Mono', ui-monospace, Menlo, monospace" font-size="11" fill="#6b675c">its edge — or it is dropped</text><path d="M 400 190 L 280 260" fill="none" stroke="#b4551e" stroke-width="1.7" marker-end="url(#m-b4551e)"/><path d="M 500 190 L 620 260" fill="none" stroke="#b4551e" stroke-width="1.7" marker-end="url(#m-b4551e)"/><rect x="251.5" y="379" width="397" height="22" rx="4" fill="#fdfcf8" stroke="#d9d3c4" stroke-width="1"/><text x="450" y="394" text-anchor="middle" font-family="'Spline Sans Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#6b675c">the AI writes the explanations · the map decides the facts</text></svg>